# task1_manip_v2: Task 1 (picking_up_trash) WAM MANIPULATION executor, three views, continued from v1.
# PRE-REGISTERED 2026-09-26 11:35 CST, before any v2 result. Development training only (train split, 180 demos).
#
# Derived from configs/lilawam_task001_multiview_manip_train.yaml (v1, run task1_manip_mv_20260926). Evidence:
#  - v1 admission (K=8, gate outputs/validation/task1_manip_admission_20260926/gate.json, 05:33 pre-registered):
#    all 4 contracts FAIL for best@4500 and last@5000; arm intent direction right (cos > 0, frac_pos >= 0.6) but K8
#    reach ratio 0.25-0.55 (< 0.5), gripper grasp/release inside the +-16-step window only 10-44% (< 0.6), always LATE.
#  - gripper copycat (outputs/validation/task1_gripper_copycat_20260926/last/summary.json, rule pre-registered in
#    progress.md 11:00): substituting only the finger opening flips the predicted command at chunk step 0 in 96.5% of
#    159 events (B 0.987, D 0.943); demo opening lags the command by ~2-3 frames, so copying it is almost free in the
#    loss and postpones every close/open at re-planning -- same mechanism as the Task-13 velocity copycat.
#  - Task-13 stage8 (motion-weighted sampling, power 1, clip [0.5,6]) raised fast-reach K8 ratio 0.566 -> 0.736.
#  - Task-1 train anchors: motion weighting ALONE would cut the share of chunks containing a gripper flip from 9.1%
#    to 5.0% (arms are slow around grasp/release) -> gripper-event weight 4 restores it to 17.3% while the top-5%
#    motion chunks get 17.0% (CPU check 11:30, reproduced by motion_sampling_weights stats).
#  - v1 was 0.65 epoch and its reach ratio was still rising between 4500 and 5000 steps.
# Changed vs v1, with reasons:
#  - model.proprio_mask positions_no_gripper: velocities AND both finger openings zeroed after normalization (shared
#    by training and the policy server); the wrist views show the fingers.
#  - training.motion_weighting {power 1, clip [0.5, 6], gripper_event_weight 4} (WeightedRandomSampler, train only).
#  - init from v1 checkpoint_last.pt (step 5000, SHA pinned below); lr restarts 2e-5 -> 5e-6 cosine (stage8 practice).
#  - max_steps = schedule_steps = 8000, samples_per_epoch 256000 (= 1.05 x 244,379 train anchors; v1+v2 ~1.7 epochs);
#    validate/save every 1000 (v1: 500) -- the trainer's MAE-selected best is secondary only.
# Kept: 3 views, absolute 23D actions, contract_proto (same contract targets SHA), frozen DINOv3, no proprio history,
#   batch 32, AdamW, future-feature lambda 0.5, seed 20260921, validation_seed 0, 512 validation samples, 85% limits.
# ADMISSION (pre-registered here and in progress.md 11:35): the SAME gate.json (05:33, anchors/thresholds unchanged),
#   K=8, candidate = checkpoint_final (step 8000) ONLY; the MAE-selected best is not evaluated for admission (MAE
#   rewards shrinkage and would undo the reweighting -- Task-13 stage8 lesson). The first dev closed loop needs the
#   three contracts of configs/task001_fixed_program.json admitted: pick up from(trash_can,floors),
#   pick up from(can_of_soda,floors), place in(can_of_soda,trash_can); place on(trash_can,floors) is reported only.
# Nothing here is closed-loop or task success.
# Launch (GPU exclusive; never with a simulator; take /tmp/project2_gpu.lock first):
#   P2_TASK_ID=1 NAME=task1_manip_v2_20260926 CONFIG=configs/lilawam_task001_multiview_manip_v2_train.yaml \
#   INIT=outputs/training/task1_manip_mv_20260926/checkpoint_last.pt scripts/run_train_unit.sh
common:
  action_dim: 23
  state_dim: 61
  action_chunk_size: 32
  proprio_len: 1
  num_inference_steps: 10
  action_execution_horizon: 1
dataset:
  task_id: 1                        # must equal P2_TASK_ID (harness/task_profile.py); checked by the trainer
  root: data/behavior-1k/2026-challenge-demos
  stats_path: data/behavior-1k/2026-challenge-demos/train_stats_task001.json
  skill_segments: data/behavior-1k/2026-challenge-demos/skill_segments_task001.json
  vtt_dir: data/skill_vtt_task001
  camera: observation.rgb.zed_link_camera_0
  image_size: [224, 224]
  frame_stride: 2
  future_frame_offset: 32
  scope: manipulation
  in_segment: true                 # real [start,end), never gap-filled segment padding
  cond_mode: contract_proto
  contract_targets: data/skill_vtt_task001/contract_targets.json
  contract_targets_sha256: e385d458e88059441923ab21bb24c9df7a72bb6fdc962cdd8116ba372b13d8f2
  skip_unsupported_contracts: true  # 6 rare annotation variants (<5 train segments) are skipped and logged
  instance_vtt_prob: 0.0           # frozen shared train-only contract prototypes
model:
  views:                            # order = view index; head must be first (view_emb[0] = stage3 path)
    - observation.rgb.zed_link_camera_0
    - observation.rgb.left_realsense_link_camera_0
    - observation.rgb.right_realsense_link_camera_0
  num_registers: 2
  use_task_cond: true
  proprio_mask: positions_no_gripper  # velocities + finger openings zeroed (32 of 61 dims kept); gripper copycat fix
  vision_encoder:
    checkpoint_path: models/dinov3-vitl16-pretrain-lvd1689m
    repo_id: facebook/dinov3-vitl16-pretrain-lvd1689m
    revision: ea8dc2863c51be0a264bab82070e3e8836b02d51
    feat_layers: [-12, -8, -4]
    include_cls_register: true
    fusion_mode: concat
    concat:
      proj_type: linear
      pre_norm: true
      out_dim: null
  future_feat:
    enabled: true
    target_layer: -4
    num_decoder_layers: 4
    num_heads: 4
  action_expert:
    depth: 12
    hidden_size: 768
    num_heads: 8
    vlm_adapter_num_queries: 64
    adapter_depth: 4
training:
  init_from_sha256: 73c60bb2ea3896d98b13b4ea0fd80df82e356a9a4b8907f3d1777c4ba48a0028  # v1 checkpoint_last.pt (step 5000)
  motion_weighting:
    power: 1.0
    clip: [0.5, 6.0]
    gripper_event_weight: 4.0
  seed: 20260921
  batch_size: 32
  grad_accum_steps: 1
  samples_per_epoch: 256000
  max_steps: 8000
  schedule_steps: 8000
  learning_rate: 0.00002
  lr_min: 0.000005
  weight_decay: 0.01
  betas: [0.9, 0.99]
  grad_clip_norm: 1.0
  time_sampler: logit_normal
  time_mu: 0.0
  time_sigma: 1.0
  use_vel_weight: false
  vel_weight_alpha: 0.2
  vel_weight_sigma: 0.01
  lambda_future_feat: 0.5
  save_every: 1000
  validate_every: 1000
  validation_samples: 512
  checkpoint_metric: upper_body_mae  # (4*trunk + 7*left_arm + 7*right_arm) / 18; not flow MSE
  validation_seed: 0               # fixed eval noise/timesteps/sampler RNG
inference:
  smooth_actions: false
  smooth_sigma: 1.0
system:
  cpu_threads: 8
  cuda_memory_fraction: 0.70
  duty_cycle: 0.8                  # GPU busy fraction; keeps average utilization below the 85% ceiling
  gpu_util_target: 85              # sleep doubles while the 20 s nvidia-smi average exceeds this
  min_sleep_s: 0.0
  vram_abort_mib: 15300
  ram_abort_percent: 85
manifest:
  stage: "development Task-1 (picking_up_trash) multi-view manipulation executor v2 (gripper-opening mask, motion + gripper-event weighted sampling)"
  task_id: 1
  derived_from_config: configs/lilawam_task001_multiview_manip_train.yaml
  offline_admission: "pre-registered K=8 gate per Task-1 contract (upper-body intent cosine, motion ratio, MAE vs copy-hold within the K8 noise floor; grippers graded separately by sign agreement); gate.json written before results"
