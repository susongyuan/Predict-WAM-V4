# Task 0 turning_on_radio WAM manipulation v2 = v1 continued with EARLY STOPPING + TRAIN-TIME IMAGE AUGMENTATION.
# Evidence (progress.md 6.3, 2026-09-28 00:19): v1 (4000 steps ~= 1 pass, fixed length) failed the held-out admission on all
# three contracts; the same metrics on 20 TRAIN demos (outputs/validation/task0_fit_gap_20260928) pass 4 of the 6 failing
# criteria -> mainly a generalization gap, not only too few epochs; press arrival stays poor even on TRAIN (precision).
# Changes vs v1 (all else identical): init = v1 final; up to 20000 steps (5 trainer epochs of 128k samples) with
# early stopping on the validation flow loss (no >= 0.5 % relative improvement for 6 validations x 500 steps = 0.75 epoch
# -> stop; v1's own curve would have stopped at step 4000 with best 0.01226 @ 2000 under this rule);
# validation every 500 steps on the SAME 512-anchor subset, plus one before the first step (must reproduce v1's 0.01231);
# 500-step linear warmup (fresh AdamW after init) then cosine 2e-5 -> 2e-6; augmentation (training batches only):
# head view crop-and-resize side scale U(0.95,1) + in-bounds shift (<= 2.5 % = 5.6 px), all views brightness/contrast/saturation U(0.85,1.15);
# wrist views are never warped (fixed gripper pixel position = grasp cue). Admission candidate = checkpoint_es_best.pt
# (best validation flow loss), evaluated with a new gate file carrying the unchanged anchors and thresholds.
# The run may be paused (SIGTERM -> checkpoint_last with the early-stopping state) for simulator jobs and resumed with
# --resume into a *_partN directory; the early-stopping state carries over.
common:
  action_dim: 23
  state_dim: 61
  action_chunk_size: 32
  proprio_len: 1
  num_inference_steps: 10
  action_execution_horizon: 1
dataset:
  task_id: 0
  root: data/behavior-1k/2026-challenge-demos
  stats_path: data/behavior-1k/2026-challenge-demos/train_stats_task000.json
  skill_segments: data/behavior-1k/2026-challenge-demos/skill_segments_task000.json
  vtt_dir: data/skill_vtt_task000
  camera: observation.rgb.zed_link_camera_0
  image_size: [224, 224]
  frame_stride: 2
  future_frame_offset: 32
  scope: manipulation
  in_segment: true
  cond_mode: contract_proto
  contract_targets: data/skill_vtt_task000/contract_targets.json
  contract_targets_sha256: 91537a4bbbbaab3bef058dccffef74ed968eea8cd1f8448175acf002649a1f86
  skip_unsupported_contracts: true  # two rare move-to(coffee_table) segments are navigation-only and excluded
  instance_vtt_prob: 0.0
model:
  views:
    - observation.rgb.zed_link_camera_0
    - observation.rgb.left_realsense_link_camera_0
    - observation.rgb.right_realsense_link_camera_0
  num_registers: 2
  use_task_cond: true
  proprio_mask: positions_no_gripper
  vision_encoder:
    checkpoint_path: models/dinov3-vitl16-pretrain-lvd1689m
    repo_id: facebook/dinov3-vitl16-pretrain-lvd1689m
    revision: ea8dc2863c51be0a264bab82070e3e8836b02d51
    feat_layers: [-12, -8, -4]
    include_cls_register: true
    fusion_mode: concat
    concat:
      proj_type: linear
      pre_norm: true
      out_dim: null
  future_feat:
    enabled: true
    target_layer: -4
    num_decoder_layers: 4
    num_heads: 4
  action_expert:
    depth: 12
    hidden_size: 768
    num_heads: 8
    vlm_adapter_num_queries: 64
    adapter_depth: 4
training:
  init_from_sha256: 7ee558063da49bc2810353f1b492e10be7e15ec5055a1321414d0637884722f7
  motion_weighting:
    power: 1.0
    clip: [0.5, 6.0]
    gripper_event_weight: 4.0
  seed: 20260921
  batch_size: 32
  grad_accum_steps: 1
  samples_per_epoch: 128000
  max_steps: 20000
  schedule_steps: 20000
  learning_rate: 0.00002
  lr_min: 0.000002
  weight_decay: 0.01
  betas: [0.9, 0.99]
  grad_clip_norm: 1.0
  time_sampler: logit_normal
  time_mu: 0.0
  time_sigma: 1.0
  use_vel_weight: false
  vel_weight_alpha: 0.2
  vel_weight_sigma: 0.01
  lambda_future_feat: 0.5
  save_every: 1000
  validate_every: 500
  validation_samples: 512
  checkpoint_metric: upper_body_mae
  warmup_steps: 500
  validate_at_start: true
  early_stopping:
    metric: val_loss_mse
    min_rel_delta: 0.005
    patience: 6
  image_augmentation:
    geometric_views: [0]
    crop_scale_min: 0.95
    brightness: 0.15
    contrast: 0.15
    saturation: 0.15
  validation_seed: 0
inference:
  smooth_actions: false
  smooth_sigma: 1.0
system:
  cpu_threads: 8
  cuda_memory_fraction: 0.70
  duty_cycle: 0.8
  gpu_util_target: 85
  min_sleep_s: 0.0
  vram_abort_mib: 15300
  ram_abort_percent: 85
manifest:
  stage: "Task-0 turning_on_radio WAM manipulation v2 (early-stopped continuation + train-time augmentation)"
  task_id: 0
  derived_from_config: configs/lilawam_task000_multiview_manip_v1_train.yaml
  initialization: "Task-0 v1 final (step 4000); continuation, not a separate result"
  success_rule: "offline held-out admission (new gate, same anchors/thresholds) on checkpoint_es_best, then physical handoff and simulator BDDL/Q>0; no scripted IK or privileged object state"
