# Task 0 turning_on_radio WAM v3: cached-DINO long training with bounded temporal memory and phase-aware view gating.
# This run is NOT early-stopped. 100k is a hard upper training budget; model selection uses the preregistered fixed
# validation subset and K=1 fixed-noise active-hand terminal FK error in the near/contact phase. Flow loss is reported
# but never selects or stops the run. The full run may start only after cache audit, unit checks, tiny overfit, a 2k
# pilot and independent code review pass (progress.md 6.4/6.5).
common:
  action_dim: 23
  state_dim: 61
  action_chunk_size: 32
  # current + lags 4/8/16/32/64 + contract-start displacement
  proprio_len: 7
  num_inference_steps: 10
  # K=1 is inference.samples, NOT execution horizon. Preserve the existing handoff cadence.
  action_execution_horizon: 8
dataset:
  task_id: 0
  root: data/behavior-1k/2026-challenge-demos
  stats_path: data/behavior-1k/2026-challenge-demos/train_stats_task000.json
  skill_segments: data/behavior-1k/2026-challenge-demos/skill_segments_task000.json
  vtt_dir: data/skill_vtt_task000
  camera: observation.rgb.zed_link_camera_0
  image_size: [224, 224]
  frame_stride: 2
  future_frame_offset: 32
  scope: manipulation
  in_segment: true
  cond_mode: contract_proto
  contract_targets: data/skill_vtt_task000/contract_targets.json
  contract_targets_sha256: 91537a4bbbbaab3bef058dccffef74ed968eea8cd1f8448175acf002649a1f86
  skip_unsupported_contracts: true
  instance_vtt_prob: 0.0
  feature_cache: data/dino_cache_task000
model:
  views:
    - observation.rgb.zed_link_camera_0
    - observation.rgb.left_realsense_link_camera_0
    - observation.rgb.right_realsense_link_camera_0
  num_registers: 2
  use_task_cond: true
  proprio_mask: positions_no_gripper
  vision_encoder:
    checkpoint_path: models/dinov3-vitl16-pretrain-lvd1689m
    repo_id: facebook/dinov3-vitl16-pretrain-lvd1689m
    revision: ea8dc2863c51be0a264bab82070e3e8836b02d51
    feat_layers: [-12, -8, -4]
    include_cls_register: true
    fusion_mode: concat
    concat:
      proj_type: linear
      pre_norm: true
      out_dim: null
  future_feat:
    enabled: true
    target_layer: -4
    num_decoder_layers: 4
    num_heads: 4
  action_expert:
    depth: 12
    hidden_size: 768
    num_heads: 8
    vlm_adapter_num_queries: 64
    adapter_depth: 4
  v3:
    proprio_lags: [4, 8, 16, 32, 64]
    memory_lags: [8, 32]
    stats_path: data/behavior-1k/2026-challenge-demos/wam_v3_stats_task000.json
    phase_hidden: 512
training:
  # Task0 v2 validation-flow best = v1 final + 500 warmup steps. Physical handoffs still failed; it is initialization,
  # not evidence of capability. The v3 run uses a fresh optimizer/schedule.
  init_from_sha256: f0ac9b1a9209fcdc358ac14a15566034d8a651071d19788ed0464879319948a9
  seed: 20260921
  validation_seed: 0
  # Preserve effective batch 32 without exceeding 70% CUDA memory budget.
  batch_size: 16
  grad_accum_steps: 2
  samples_per_epoch: 128000
  max_steps: 100000
  schedule_steps: 100000
  learning_rate: 0.00005
  lr_min: 0.000005
  warmup_steps: 2000
  weight_decay: 0.01
  betas: [0.9, 0.99]
  grad_clip_norm: 1.0
  time_mu: 0.0
  time_sigma: 1.0
  motion_weighting:
    power: 1.0
    clip: [0.5, 6.0]
    gripper_event_weight: 4.0
  auxiliary_loss:
    future: 0.5
    gate_kl: 0.05
    phase_ce: 0.02
    log_dist: 0.01
  save_every: 5000
  validate_every: 5000
  validation_samples: 512
  fine_validation_samples: 256
  checkpoint_metric: fine_eef_m
inference:
  samples: 1
  smooth_actions: false
  smooth_sigma: 1.0
system:
  cpu_threads: 8
  cuda_memory_fraction: 0.70
  duty_cycle: 0.8
  gpu_util_target: 85
  min_sleep_s: 0.0
  vram_abort_mib: 15300
  ram_abort_percent: 85
manifest:
  stage: "Task-0 WAM v3 temporal-memory + phase-gated multiview long training"
  task_id: 0
  derived_from_config: configs/lilawam_task000_multiview_manip_v2_train.yaml
  initialization: "Task-0 v2 checkpoint_es_best (step 500; fresh optimizer); v3 modules start from recorded initialization"
  early_stopping: false
  checkpoint_rule: "minimum K=1 fixed-noise active-hand terminal FK position error on fixed validation near/contact anchors"
  success_rule: "offline K=1 fine metric and unchanged contract gate, then physical pick/press/place handoffs and dev simulator BDDL/Q; no privileged policy input"
